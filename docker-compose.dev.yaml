volumes:
  pg_data:
  static:
  minio_data:
  logs:

services:
  db:
    image: postgres:16-alpine
    container_name: backend_db
    restart: unless-stopped
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: backend_minio
    restart: unless-stopped
    env_file: .env
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 2s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: backend_redis
    restart: unless-stopped
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: maxwell884/code-unity-backend:dev
    container_name: backend
    restart: unless-stopped
    depends_on:
      - db
      - minio
      - redis
    env_file: .env
    environment:
      - DB_MODE=network
    volumes:
      - static:/backend_static/static/
      - logs:/app/logs/

  celeryworker:
    image: maxwell884/code-unity-backend:dev
    container_name: celeryworker
    restart: unless-stopped
    depends_on:
      - db
      - minio
      - redis
    env_file: .env
    environment:
      - DB_MODE=network
    volumes:
      - logs:/app/logs/
    command: celery -A config.celery_app worker -l INFO
  nginx:
    build: ./nginx
    image: hihix/backend-nginx:latest
    container_name: backend_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - static:/backend_static/static/:ro
    depends_on:
      - backend