[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backend"
version = "0.1.0"
description = "Django backend project"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
]

dependencies = [
    "Django>=4.2,<5.0",
    "djangorestframework>=3.14,<4.0",
    "django-cors-headers>=4.0,<5.0",
    "psycopg2-binary>=2.9,<3.0",
    "gunicorn>=21.0,<22.0",
    "python-dotenv==1.2.2",
    "djangorestframework-simplejwt>=5.5.1",
    "dj-rest-auth[with-social]>=7.2.0",
    "django-allauth>=65.16.1",
    "drf-spectacular>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "flake8>=7.0",
    "mypy>=1.8",
]

[project.scripts]
manage = "manage:main"

[tool.uv]
# Конфигурация uv
index-url = "https://pypi.org/simple"

[tool.hatch.build.targets.wheel]
packages = ["config"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_test.py"]
addopts = "-v --tb=short"
testpaths = ["."]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.ruff]
src = ["."]
indent-width = 4
line-length = 88
required-version = ">=0.14.0"
target-version = "py312"

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv*",
    ".vscode",
    "__pycache__",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    ".terraform",
    "*/site-packages/*",
    "*/migrations/*",
    "venv/",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "D",
    "UP", "FLY", "SIM", "C4", "PIE", "PERF", "FURB", "RUF",
    "TID", "TCH", "ICN", "INP",
    "S", "BLE", "TRY", "EM", "EXE",
    "G", "LOG", "T10", "T20",
    "PT", "INT", "TD", "PGH",
    "N", "B", "A", "FBT", "RSE", "SLF", "Q", "ISC", "COM", "DTZ", "ARG", "PTH",
    "ANN",
    "ASYNC",
    "ERA",

]

ignore = [
    "S101",
    "D100",   # no need for module docstring
    "D104",   # no need for package docstring
    "D105",   # magic methods
    "D106",   # metaclasses
    "D107",   # __init__
    "D203",
    "D211",
    "D212",
    "D213",
    "INP001",
    "ANN401",
    "N818",
    "ARG001",
    "RUF001", "RUF002", "RUF003",

]

unfixable = [
    "F401",  # Unused imports
    "F841"   # Unused variables
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
lines-between-types = 0
case-sensitive = true

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-type-checking]
strict = false

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pycodestyle]
max-doc-length = 79
max-line-length = 88

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "E401"]
"**/manage.py" = ["ALL"]
"scripts/**/*.py" = ["T20"]
"**/migrations/*.py" = ["ALL"]
"**/asgi.py" = ["ALL"]
"**/wsgi.py" = ["ALL"]
"**/settings.py" = ["ALL"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 60
