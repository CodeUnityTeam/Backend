volumes:
  pg_data:
  static:
  minio_data:

services:
  db:
    image: postgres:16-alpine
    container_name: backend_db
    restart: unless-stopped
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: backend_minio
    restart: unless-stopped
    env_file: .env
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 2s
      retries: 3

  backend:
    depends_on:
      - db
      - minio
    image: enigmatica33/backend:latest
    env_file: .env
    volumes:
      - static:/backend_static/static/

  nginx:
    build: ./nginx
    image: hihix/backend-nginx:latest
    container_name: backend_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - static:/backend_static/static/:ro
    depends_on:
      - backend