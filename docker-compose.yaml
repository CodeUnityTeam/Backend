volumes:
  pg_data:
  static:

services:
  db:
    image: postgres:16-alpine
    container_name: backend_db
    restart: unless-stopped
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    depends_on:
      - db
    image: enigmatica33/backend:latest
    env_file: .env
    volumes:
      - static:/backend_static/static/

  nginx:
    build: ./nginx
    container_name: backend_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - static:/backend_static/static/:ro
    depends_on:
      - backend