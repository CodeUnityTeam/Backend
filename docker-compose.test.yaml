name: code-unity-test

volumes:
  pg_data:
  static:
  minio_data:

services:
  db:
    image: postgres:16-alpine
    container_name: test_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: test_minio
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:alpine
    container_name: test_redis
    restart: unless-stopped
    env_file:
      - .env
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD";
      else
        redis-server;
      fi'
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: maxwell884/code-unity-backend:test
    container_name: test_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_MODE: network
    volumes:
      - static:/backend_static/static/
      - ./fixtures:/opt/user123/fixtures

  frontend:
    image: maxwell884/code-unity-frontend:latest
    container_name: test_frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: maxwell884/code-unity-backend-nginx:test
    container_name: test_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - static:/backend_static/static/:ro
    depends_on:
      - backend
      - frontend
