  build_and_push_backend:
    name: Build and push backend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.TEST_DOCKER_USERNAME }}
          password: ${{ secrets.TEST_DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}

  build_and_push_nginx:
    name: Build and push nginx image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.TEST_DOCKER_USERNAME }}
          password: ${{ secrets.TEST_DOCKER_PASSWORD }}

      - name: Build and push nginx
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}

  deploy:
    name: Deploy to test server
    runs-on: ubuntu-latest
    needs:
      # - build_and_push_frontend
      - build_and_push_backend
      - build_and_push_nginx

    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4

      - name: Copy test compose file to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.TEST_SSH_PASSPHRASE }}
          source: "docker-compose.test.yaml"
          target: "/opt/user123"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.TEST_SSH_PASSPHRASE }}
          script: |
            cd /opt/user123/
            sudo docker compose -f docker-compose.test.yaml pull
            sudo docker compose -f docker-compose.test.yaml down
            sudo docker compose -f docker-compose.test.yaml up -d
            sudo docker compose -f docker-compose.test.yaml exec -T backend python manage.py makemigrations
            sudo docker compose -f docker-compose.test.yaml exec -T backend python manage.py migrate
            sudo docker compose -f docker-compose.test.yaml exec -T backend python manage.py loaddata fixtures/tags/formats.json
            sudo docker compose -f docker-compose.test.yaml exec -T backend python manage.py loaddata fixtures/tags/specializations.json
            sudo docker compose -f docker-compose.test.yaml exec -T backend python manage.py loaddata fixtures/tags/skills.json
            sudo docker compose -f docker-compose.test.yaml exec -T backend python manage.py collectstatic --noinput
            sudo docker image prune -a -f