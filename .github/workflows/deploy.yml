name: Deploy to dev server

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  BACKEND_IMAGE: ${{ secrets.TEST_DOCKER_USERNAME }}/code-unity-backend:dev
  COMPOSE_FILE: docker-compose.dev.yaml

jobs:
  build_and_push_backend:
    name: Push backend Docker image to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.TEST_DOCKER_USERNAME }}
          password: ${{ secrets.TEST_DOCKER_PASSWORD }}
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_and_push_backend
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Copy docker-compose.dev.yaml via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.TEST_SSH_PASSPHRASE }}
          source: "docker-compose.dev.yaml"
          target: "/opt/code-unity-dev"
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.TEST_SSH_PASSPHRASE }}
          script: |
            set -e
            cd /opt/code-unity-dev/
            sudo docker compose -f docker-compose.dev.yaml pull
            sudo docker compose -f docker-compose.dev.yaml down
            sudo docker compose -f docker-compose.dev.yaml up -d
            sudo docker compose -f docker-compose.dev.yaml exec -T backend python manage.py makemigrations
            sudo docker compose -f docker-compose.dev.yaml exec -T backend python manage.py migrate
            sudo docker compose -f docker-compose.dev.yaml exec -T backend python manage.py loaddata fixtures/tags/formats.json
            sudo docker compose -f docker-compose.dev.yaml exec -T backend python manage.py loaddata fixtures/tags/specializations.json
            sudo docker compose -f docker-compose.dev.yaml exec -T backend python manage.py loaddata fixtures/tags/skills.json
            sudo docker compose -f docker-compose.dev.yaml exec -T backend python manage.py collectstatic --noinput
            sudo docker image prune -a -f
