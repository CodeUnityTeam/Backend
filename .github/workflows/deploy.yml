name: Deploy to dev server

on:
  push:
    branches:
      - main

jobs:
  build_and_push_backend:
    name: Push backend Docker image to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/backend:latest

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_and_push_backend
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Copy docker-compose.dev.yaml via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.dev.yaml"
          target: "/code-unity"
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /code-unity/
            sudo docker compose -f docker-compose.dev.yaml pull
            sudo docker compose -f docker-compose.dev.yaml down
            sudo docker compose -f docker-compose.dev.yaml up -d
            sudo docker compose -f docker-compose.dev.yaml exec backend python manage.py makemigrations
            sudo docker compose -f docker-compose.dev.yaml exec backend python manage.py migrate
            sudo docker compose -f docker-compose.dev.yaml exec backend python manage.py collectstatic --noinput
            sudo docker image prune -a -f
