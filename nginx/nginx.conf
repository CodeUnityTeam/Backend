# TODO: Добавить прокси для MinIO.
#   Сейчас nginx проксирует только backend и статику.
#   Аватары и изображения хранятся в MinIO, но nginx на них не проксирует.
#   В production нужно добавить location /media/ с proxy_pass на MinIO.
server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /backend_static/static/;
    }
}